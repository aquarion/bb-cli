name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # create-phar.php stamps in `git describe --tags`, and PharBuildTest
          # builds the release artefact, so the full history is needed.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, json, phar
          coverage: pcov
          ini-values: phar.readonly=0

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure git for the test fixtures
        run: |
          git config --global user.email "tests@example.com"
          git config --global user.name "bb-cli tests"
          git config --global init.defaultBranch main

      - name: Lint
        run: |
          php -l bin/bb
          php -l create-phar.php
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # HttpTransportTest talks to a PHP built-in server on loopback; hosted
      # runners have no proxy configured, so no NO_PROXY handling is needed.
      - name: Run tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
